<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wanderplanung</title>
  <style>
    :root{
      --bg:#f9f9f9;     /* leicht gedecktes Weiß */
      --card:#f0f0f0;   /* etwas dunkleres Weiß für die Box */
      --muted:#6b7280;
      --accent:#111827;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;
      background:var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      color:var(--accent);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .card{
      background:var(--card);
      padding:28px 36px;
      border-radius:16px;
      box-shadow:0 6px 30px rgba(16,24,40,0.08);
      max-width:540px;
      width:100%;
      text-align:center;
    }
    h1{margin:0 0 10px;font-weight:600;font-size:20px}
    p.lead{margin:0 0 22px;color:var(--muted)}

    .countdown{
      display:flex;
      gap:12px;
      justify-content:center;
      font-size:32px;
      font-weight:600;
      letter-spacing:0.02em;
    }
    .unit{display:flex;flex-direction:column;align-items:center;}
    .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-top:4px;}

    @media (prefers-color-scheme:dark){
      :root{--bg:#0b1020;--card:#071025;--muted:#9aa4b2;--accent:#e6eef8}
      body{background:var(--bg)}
      .card{box-shadow:0 8px 40px rgba(2,6,23,0.7)}
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Come back later please!</h1>
    <p class="lead">Wanderplanungstool release:</p>

    <div class="countdown" aria-live="polite" aria-atomic="true" id="countdown">
      <div class="unit"><div class="value" id="days">—</div><span class="label">Days</span></div>
      <div class="unit"><div class="value" id="hours">—</div><span class="label">Hours</span></div>
      <div class="unit"><div class="value" id="minutes">—</div><span class="label">Minutes</span></div>
      <div class="unit"><div class="value" id="seconds">—</div><span class="label">Seconds</span></div>
    </div>
  </main>

  <script>
    (function(){
      var now = new Date();
      var year = now.getFullYear();
      var target = new Date(year, 11, 20, 0, 0, 0);
      if(now > target) target = new Date(year+1,11,20,0,0,0);
      var els = {
        days: document.getElementById('days'),
        hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'),
        seconds: document.getElementById('seconds')
      };
      function pad(n){return String(n).padStart(2,'0')}
      function update(){
        var now = new Date();
        var diff = Math.max(0,Math.floor((target-now)/1000));
        var days = Math.floor(diff/86400);
        var hours = Math.floor((diff%86400)/3600);
        var minutes = Math.floor((diff%3600)/60);
        var seconds = diff%60;
        els.days.textContent = days;
        els.hours.textContent = pad(hours);
        els.minutes.textContent = pad(minutes);
        els.seconds.textContent = pad(seconds);
      }
      update();
      setInterval(update,1000);
    })();
  </script>
</body>
</html>
